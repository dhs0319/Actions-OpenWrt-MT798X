name: 25.12-clx-s20p

on:
  workflow_dispatch:
    inputs:
      ssh:
        description: SSH connection to Actions
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: 25.12-clx-s20p-${{ github.ref }}
  cancel-in-progress: false

env:
  DEVICE_NAME: 25.12-clx-s20p
  REPO_URL: https://github.com/hxlls/n60pro-hightpower-immo.git
  REPO_BRANCH: n60pro-high-power
  SOURCE_REVISION: 072cd385386b5b7becad12b5c072d7ee2de01bf7
  CONFIG_FILE: 25.12/mt7986-clx-s20p.config
  DIY_P1_SH: 25.12/diy-part1.sh
  DIY_P2_SH: 25.12/diy-part2.sh
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 355
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false
      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev libelf-dev python3-setuptools rsync swig unzip zlib1g-dev file wget ccache bc time xxd python3-dev python3-pip cmake ninja-build libfuse-dev
          sudo timedatectl set-timezone "$TZ"
      - name: Clone high-power source
        run: |
          git clone --single-branch --branch "$REPO_BRANCH" "$REPO_URL" openwrt
          git -C openwrt checkout --detach "$SOURCE_REVISION"
          git -C openwrt rev-parse HEAD > source-revision.txt
      - name: Install feeds
        working-directory: openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a
      - name: Apply main DIY scripts
        working-directory: openwrt
        run: |
          bash -e "$GITHUB_WORKSPACE/$DIY_P1_SH"
          bash -e "$GITHUB_WORKSPACE/$DIY_P2_SH"
      - name: Align Go with the 25.12 packages feed
        working-directory: openwrt
        run: |
          mv feeds/packages/lang/golang "$RUNNER_TEMP/golang-from-diy"
          git -C feeds/packages restore lang/golang
          ./scripts/feeds update -i packages
          ./scripts/feeds install -a
      - name: Resolve duplicate OAF package definitions
        working-directory: openwrt
        run: |
          # DIY provides both appfilter and kmod-oaf; do not scan the feed copy.
          test -f package/custom/OpenAppFilter/oaf/Makefile
          test -f package/custom/OpenAppFilter/open-app-filter/Makefile
          if [ -L package/feeds/packages/open-app-filter ]; then
            mv package/feeds/packages/open-app-filter "$RUNNER_TEMP/open-app-filter-feed-link"
          fi
      - name: Configure and check
        working-directory: openwrt
        run: |
          cp "$GITHUB_WORKSPACE/$CONFIG_FILE" .config
          make defconfig 2>&1 | tee "$GITHUB_WORKSPACE/defconfig.log"
          python3 "$GITHUB_WORKSPACE/25.12/check-s20p-power-table.py" source .
          python3 "$GITHUB_WORKSPACE/25.12/check-s20p-highpower.py" config .config "$GITHUB_WORKSPACE/$CONFIG_FILE"
          cp .config "$GITHUB_WORKSPACE/resolved.config"
      - name: SSH connection to Actions
        if: inputs.ssh
        uses: mxschmitt/action-tmate@v3
      - name: Cache source downloads
        uses: actions/cache@v4
        with:
          path: openwrt/dl
          key: ${{ env.DEVICE_NAME }}-dl-${{ env.SOURCE_REVISION }}-${{ github.run_id }}
          restore-keys: |
            ${{ env.DEVICE_NAME }}-dl-${{ env.SOURCE_REVISION }}-
      - name: Download sources
        working-directory: openwrt
        run: make download -j8 || make download -j1 V=s
      - name: Build firmware
        working-directory: openwrt
        run: |
          make -j"$(nproc)" 2>&1 | tee "$GITHUB_WORKSPACE/build.log" || make -j1 V=s 2>&1 | tee "$GITHUB_WORKSPACE/build-retry.log"
      - name: Verify image and package manifest
        working-directory: openwrt
        run: |
          python3 "$GITHUB_WORKSPACE/25.12/check-s20p-highpower.py" image bin/targets/mediatek/filogic "$GITHUB_WORKSPACE/$CONFIG_FILE"
          python3 "$GITHUB_WORKSPACE/25.12/check-s20p-power-table.py" rootfs . | tee "$GITHUB_WORKSPACE/power-table-verification.json"
      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.DEVICE_NAME }}-logs-${{ github.run_id }}
          path: |
            defconfig.log
            build.log
            build-retry.log
            resolved.config
            power-table-verification.json
          if-no-files-found: warn
      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.DEVICE_NAME }}-${{ github.run_id }}
          path: |
            openwrt/bin/targets/mediatek/filogic/*s20p*sysupgrade*
            openwrt/bin/targets/mediatek/filogic/*s20p*initramfs*
            openwrt/bin/targets/mediatek/filogic/*.manifest
            openwrt/bin/targets/mediatek/filogic/sha256sums
            source-revision.txt
            resolved.config
            power-table-verification.json
          if-no-files-found: error
      - name: Publish firmware
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.DEVICE_NAME }}-${{ github.run_id }}
          name: ${{ env.DEVICE_NAME }} build ${{ github.run_number }}
          body: |
            Source: ${{ env.REPO_URL }} @ ${{ env.SOURCE_REVISION }}
            Configuration: ${{ env.CONFIG_FILE }}
            Components: main DIY part1/part2 scripts from this workflow checkout.
            Hardware operation and transmit power require device validation.
          files: |
            openwrt/bin/targets/mediatek/filogic/*s20p*sysupgrade*
            openwrt/bin/targets/mediatek/filogic/*s20p*initramfs*
            openwrt/bin/targets/mediatek/filogic/*.manifest
            openwrt/bin/targets/mediatek/filogic/sha256sums
            source-revision.txt
            resolved.config
            power-table-verification.json
          fail_on_unmatched_files: true
