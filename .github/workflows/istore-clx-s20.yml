# 参考 VIKINGYFY/OpenWRT-CI，调用公用编译核心 WRT-CORE.yml
name: istore-clx-s20

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      PACKAGE:
        description: '手动调整插件包，多个请用\n符号隔开。'
        required: false
        type: string
      TEST:
        description: '仅输出配置文件，不编译固件。'
        default: false
        required: false
        type: boolean
      SSH:
        description: 'SSH connection to Actions'
        default: false
        required: false
        type: boolean

# 创建/删除 Release、删除 workflow runs、删除旧缓存 必需
permissions:
  contents: write
  actions: write

jobs:
  config:
    name: ${{matrix.CONFIG}}
    strategy:
      fail-fast: false
      matrix:
        # 各机型使用独立的目标平台与 MTK 驱动配置，共用 GENERAL.txt
        CONFIG: [CLX-S20P, CLX-S20L]
        SOURCE: [Yuzhii0718/immortalwrt-mt798x-6.6-padavanonly]
        BRANCH: [openwrt-24.10-6.6]

    uses: ./.github/workflows/WRT-CORE.yml
    with:
      #编译配置：Config/<CONFIG>.txt + Config/GENERAL.txt
      WRT_CONFIG: ${{matrix.CONFIG}}
      #默认主题
      WRT_THEME: argon
      #默认主机名，留空不修改
      WRT_NAME: ''
      #默认WIFI名称/密码，留空不修改（仅对 mac80211 驱动生效）
      WRT_SSID: ''
      WRT_WORD: ''
      #默认地址
      WRT_IP: 192.168.30.1
      #默认密码，仅作提示，修改无用
      WRT_PW: 无
      #源码链接
      WRT_REPO: https://github.com/${{matrix.SOURCE}}.git
      #源码分支
      WRT_BRANCH: ${{matrix.BRANCH}}
      #源码名称
      WRT_SOURCE: ${{matrix.SOURCE}}
      #插件调整
      WRT_PACKAGE: ${{inputs.PACKAGE}}
      #仅输出配置文件
      WRT_TEST: ${{inputs.TEST || false}}
      #SSH 调试
      WRT_SSH: ${{inputs.SSH || false}}
